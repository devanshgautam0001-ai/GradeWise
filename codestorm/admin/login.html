<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeStorm 2026 - Organizer & Admin Portal.">
  <title>Admin Portal | CodeStorm 2026</title>
  
  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <!-- Accessible Skip to Content Link -->
  <a href="#main-admin-auth" class="skip-to-content">Skip to admin login form</a>

  <main id="main-admin-auth" class="auth-main">
    <div class="auth-container">
      <div class="auth-card auth-admin-card">
        <header class="auth-card-header">
          <div class="admin-badge-container">
            <span class="badge badge-admin">Organizer Access</span>
          </div>

          <div class="auth-brand" aria-label="CodeStorm 2026 Admin Portal">
            <span class="brand-icon" style="border-color: rgba(245, 158, 11, 0.4); color: var(--admin-light);" aria-hidden="true">&lt;/&gt;</span>
            <span class="auth-brand-name">CodeStorm <span>2026</span></span>
          </div>

          <h1 class="auth-title">Admin Portal</h1>
          <p class="auth-subtitle">Restricted access for contest organizers and test administrators</p>
        </header>

        <form id="admin-login-form" class="auth-form" novalidate>
          <div class="form-group" id="admin-id-group">
            <label for="admin-id" class="form-label">Admin ID</label>
            <input 
              type="text" 
              id="admin-id" 
              name="adminId" 
              class="form-input" 
              placeholder="e.g. ADM-ROOT-01" 
              autocomplete="username" 
              required
              aria-required="true"
            >
            <span class="form-error-msg" id="admin-id-error">Please enter your Admin ID.</span>
          </div>

          <div class="form-group" id="admin-password-group">
            <label for="admin-password" class="form-label">Password</label>
            <input 
              type="password" 
              id="admin-password" 
              name="password" 
              class="form-input" 
              placeholder="Enter admin password" 
              autocomplete="current-password" 
              required
              aria-required="true"
            >
            <span class="form-error-msg" id="admin-password-error">Please enter your password.</span>
          </div>

          <button type="submit" class="btn btn-admin btn-block btn-lg" id="admin-login-submit">
            Admin Login
          </button>

          <!-- Accessible Feedback Box for Phase 1/5 Preview -->
          <div id="admin-auth-feedback" class="status-feedback" aria-live="polite"></div>
        </form>

        <footer class="auth-card-footer">
          <span style="font-size: var(--text-xs); color: var(--text-muted); font-family: var(--font-mono);">
            Organizer Authorization Required
          </span>
        </footer>
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script type="module" src="../js/main.js"></script>
</body>
</html>
