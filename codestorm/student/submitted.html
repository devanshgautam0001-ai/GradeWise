<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CodeStorm 2026 - Contest Submission Recorded.">
  <title>Submission Recorded | CodeStorm 2026</title>
  
  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <main class="auth-main">
    <div class="auth-container">
      <div class="auth-card auth-student-card placeholder-view">
        <div class="placeholder-icon" style="color: var(--success); border-color: rgba(16, 185, 129, 0.4); background-color: var(--success-surface);" aria-hidden="true">
          &#x2713;
        </div>
        
        <div class="placeholder-badge">
          <span class="badge" style="background-color: var(--success-surface); color: var(--success); border-color: rgba(16, 185, 129, 0.3);">
            Contest Completed
          </span>
        </div>

        <div class="auth-brand" aria-label="CodeStorm 2026">
          <span class="auth-brand-name">CodeStorm <span>2026</span></span>
        </div>

        <h1 class="auth-title">Submission Recorded</h1>
        <p class="auth-subtitle" style="margin-bottom: var(--space-6);">
          Your test submission has been successfully recorded.
        </p>

        <div style="background-color: var(--bg-input); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-6); text-align: left;">
          <p style="font-size: var(--text-xs); color: var(--text-secondary); margin: 0; line-height: 1.6;">
            All your algorithmic solutions and timestamps have been logged into the evaluation queue. Official scorecards and contest leaderboards will be published by the organizers.
          </p>
        </div>

        <div class="form-group">
          <a href="login.html" class="btn btn-primary btn-block btn-lg" id="btn-exit-contest">
            Exit to Login
          </a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
